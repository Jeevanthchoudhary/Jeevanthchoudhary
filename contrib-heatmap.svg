<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 160" width="100%" height="100%" style="background-color: #0d1117;">
<style>
  text { font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, monospace; fill: #8b949e; font-size: 10px; }
  .heat-box { rx: 2px; ry: 2px; transition: fill 0.2s; }
  .reveal { animation: slideDown 1s ease-out forwards; opacity: 0; }
@keyframes slideDown {
  0% { transform: translateY(-10px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
</style>
<rect width="100%" height="100%" fill="#0d1117" rx="6" stroke="#30363d" stroke-width="1"/>
<g class="reveal" transform="translate(20, 25)">
<text x="0" y="125">0 contributions in the last year</text>
<text x="650" y="125">Less</text>
<rect x="680" y="116" width="11" height="11" fill="#161b22" rx="2"/>
<rect x="694" y="116" width="11" height="11" fill="#0e4429" rx="2"/>
<rect x="708" y="116" width="11" height="11" fill="#006d32" rx="2"/>
<rect x="722" y="116" width="11" height="11" fill="#26a641" rx="2"/>
<rect x="736" y="116" width="11" height="11" fill="#39d353" rx="2"/>
<text x="755" y="125">More</text>
</g>
</svg>