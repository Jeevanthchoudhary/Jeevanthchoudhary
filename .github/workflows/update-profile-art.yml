name: Update Profile Art & Heatmap

on:
  schedule:
    - cron: '0 0 * * *' # Runs every day at midnight UTC
  workflow_dispatch: # Allows manual run from GitHub Actions tab

jobs:
  update-profile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Run heatmap renderer
        run: python scripts/render_heatmap_svg.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.io'
          git add data/contributions.json contrib-heatmap.svg
          git diff --staged --quiet || (git commit -m "chore: auto-update contribution heatmap and data" && git push)